[openrouter]
# Use your `.env` or set openrouter api keys here
api_key = ""

[experiment]
output_dir = "outputs"
runs_per_task = 1
seed = 42

[mas]
levels = 1
intra_level_link_ratio = 1.0
full_linked = true
number_of_agents = 1
agent_types = ["general"]
communication_count_internally = 0
turn_mode = "single_turn"
max_turns = 1

[models]
default = "google/gemini-3-flash-preview"

[scicode]
split = "test"
with_background = false
h5py_file = "data/test_data.h5"
