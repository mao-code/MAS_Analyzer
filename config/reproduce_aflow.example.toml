[openrouter]
api_key = ""
base_url = "https://openrouter.ai/api/v1"
timeout_s = 600

[experiment]
output_dir = "outputs_aflow_reproduce"
runs_per_task = 1
seed = 42
task_limit = 40

[models]
default = "google/gemma-4-31b-it"

[mas]
levels = 1
intra_level_link_ratio = 1.0
full_linked = true
number_of_agents = 1
agent_types = ["general"]
communication_count_internally = 0
turn_mode = "single_turn"
max_turns = 1

[browsecomp]
auto_download = true
eval_mode = "llm_judge"
judge_model = "openai/gpt-4.1-mini"
judge_temperature = 0.0
judge_max_tokens = 4096
enable_tools = true
tool_k = 5
include_get_document = true
max_tool_iterations = 8

[plancraft]
split = "val.small"
max_steps = 30
resolution = "high"
recipe_search = false

[workbench]
domain = "multi_domain"
tasks_version = "v1"
tool_selection = "domains"
max_tool_iterations = 20

[stabletoolbench]
auto_download = true
auto_download_server_assets = false
task_sets = ["G1_instruction"]
virtual_server_url = "http://localhost:8080/virtual"
enable_tools = true
max_tool_iterations = 8
eval_mode = "fac"
judge_model = "openai/gpt-4.1-mini"
judge_api_base = "https://openrouter.ai/api/v1"
judge_temperature = 0.0
judge_max_tokens = 256

[math500]
split = "test"
