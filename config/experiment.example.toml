# ============================================================================
# MAS_Analyzer Experiment Configuration (Example)
# ============================================================================
# Copy this file to config/experiment.toml and fill in your API key:
#   cp config/experiment.example.toml config/experiment.toml
#
# config/*.toml is gitignored, so your keys stay local.
# ============================================================================

[openrouter]
api_key = ""                # Set your OpenRouter API key here, or use OPENROUTER_API_KEY env var
base_url = "https://openrouter.ai/api/v1"
timeout_s = 600             # Wall-clock timeout per LLM request in seconds

[experiment]
output_dir = "outputs"
runs_per_task = 1           # How many times to repeat each task (for stability metrics)
seed = 42
task_limit = 5              # Max tasks to run (remove or set to null for all tasks)

[models]
default = "google/gemini-3-flash-preview"
# Per-agent-type overrides (optional):
# planner = "openai/gpt-4.1"
# verifier = "anthropic/claude-sonnet-4"

# ============================================================================
# MAS Configuration
# ============================================================================
[mas]
levels = 1
intra_level_link_ratio = 1.0
full_linked = true
number_of_agents = 1
agent_types = ["general"]
communication_count_internally = 0
turn_mode = "single_turn"   # "single_turn" or "multi_turn"
max_turns = 20              # Default safety cap when turn_mode = "multi_turn"
termination_consensus_mode = "llm_judge"  # "llm_judge" (default) or "lexical"
final_vote_mode = "llm_judge"             # "llm_judge" (default) or "deterministic"
peer_artifact_max_chars = 320             # Max chars copied from one agent artifact into peer-visible packets

# --- Self-evolved topology (set mas.topology = "self_evolved" to enable) ---
# An LLM Topology Planner proposes a per-task topology, a Trace Auditor updates
# short-term turn memory and can trigger at most one trace-backed repair, then
# the run finalizes.
# [self_evolved]
# harness_backend = "openrouter"      # "openrouter" or "claude_agent_sdk" (needs ANTHROPIC_API_KEY)
# max_initial_agents = 5              # Cap on the planner's initial topology size
# max_total_agents = 10               # Hard cap after the single mutation
# max_turns = 2                       # 1 initial turn + at most 1 repair turn
# audit_mode = "heuristic"            # "heuristic" or "llm_judge"
# playbook_path = "config/topology_playbook.json"
# playbook_read = true                # Planner reads the long-term skill (and applies it
#                                     # in both the initial plan and the repair mutation)
# Runs always update a short-term in-memory playbook every turn. The long-term skill
# (config/topology_skill.md) updates either:
#   - online, mid-experiment (DEFAULT): skill_update_batch_size = 8 below (true self-evolution);
#   - or offline: set skill_update_batch_size = 0 and run scripts/reflect_topology_skill.py.
# Either way the skill is reflected from PROCESS SIGNALS ONLY (auditor findings + consensus),
# never the benchmark verdict, so the self-evolved system is not biased by ground truth.
# skill_update_batch_size = 8         # DEFAULT 8: a single `run` command pauses every N freshly
#                                     # executed runs to reflect them into the skill, then resumes.
#                                     # Use ONE sequential process (concurrent writers race);
#                                     # set 0 for parallel experiments (offline reflection only).
# default_packet_max_chars = 320      # Packet bound when mas.peer_artifact_max_chars = 0

