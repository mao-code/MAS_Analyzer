# Verification config for the self-evolved workbench/browsecomp fixes.
# Mirrors raw_config_snapshot of full_selfevo__google_gemma_4_31b_it_nitro so the
# re-run is apples-to-apples with the failing baseline. api_key resolved from .env.

[openrouter]
api_key = ""
base_url = "https://openrouter.ai/api/v1"
timeout_s = 150.0

[experiment]
output_dir = "artifacts/verify_selfevo_fix"
runs_per_task = 3
seed = 42
task_limit = 10

[models]
default = "google/gemma-4-31b-it:nitro"
judge = "google/gemma-4-31b-it:nitro"

[mas]
topology = "self_evolved"
number_of_agents = 5
agent_types = ["general"]
levels = 1
intra_level_link_ratio = 1.0
full_linked = true
communication_count_internally = 2
discussion_rounds = 1
minimum_discussion_rounds = 1
max_turns = 2
turn_mode = "multi_turn"
enable_dynamic_roles = true
final_vote_mode = "llm_judge"
termination_consensus_mode = "llm_judge"
peer_artifact_max_chars = 0

[self_evolved]
harness_backend = "openrouter"
max_initial_agents = 5
max_total_agents = 10
max_turns = 2
audit_mode = "heuristic"
playbook_path = "config/topology_playbook.json"
playbook_read = true
default_packet_max_chars = 0

[workbench]
domain = "multi_domain"
tool_selection = "domains"
max_tool_iterations = 20

[browsecomp]
auto_download = true
decrypted_path = "benchmark/browsecomp/data/browsecomp_plus_decrypted.jsonl"
enable_tools = true
eval_mode = "substring"
include_get_document = true
max_tool_iterations = 6
qrel_evidence_path = "benchmark/browsecomp/topics-qrels/qrel_evidence.txt"
qrel_golds_path = "benchmark/browsecomp/topics-qrels/qrel_golds.txt"
tool_k = 5
tool_snippet_max_tokens = 160
