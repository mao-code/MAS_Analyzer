[openrouter]
api_key = ""
base_url = "https://openrouter.ai/api/v1"

[experiment]
output_dir = "artifacts/benchmark_traces/browsecomp"
runs_per_task = 1
seed = 42
task_limit = 10

[models]
default = "google/gemini-3-flash-preview"

[mas]
levels = 1
intra_level_link_ratio = 1.0
full_linked = true
number_of_agents = 1
agent_types = ["general"]
communication_count_internally = 0
turn_mode = "single_turn"
max_turns = 1

[browsecomp]
decrypted_path = "benchmark/browsecomp/data/browsecomp_plus_decrypted.jsonl"
qrel_evidence_path = "benchmark/browsecomp/topics-qrels/qrel_evidence.txt"
qrel_golds_path = "benchmark/browsecomp/topics-qrels/qrel_golds.txt"
auto_download = true
eval_mode = "substring"
enable_tools = true
tool_k = 5
include_get_document = true
tool_snippet_max_tokens = 512
max_tool_iterations = 8
