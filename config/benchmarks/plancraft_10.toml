[openrouter]
api_key = ""
base_url = "https://openrouter.ai/api/v1"

[experiment]
output_dir = "artifacts/benchmark_traces/plancraft"
runs_per_task = 1
seed = 42
task_limit = 10

[models]
default = "google/gemini-3-flash-preview"

[mas]
levels = 1
intra_level_link_ratio = 1.0
full_linked = true
number_of_agents = 1
agent_types = ["general"]
communication_count_internally = 0
turn_mode = "single_turn"
max_turns = 1

[plancraft]
split = "val.small"
max_steps = 30
resolution = "high"
