[openrouter]
api_key = ""
base_url = "https://openrouter.ai/api/v1"

[experiment]
output_dir = "artifacts/benchmark_traces/finance_agent"
runs_per_task = 1
seed = 42
task_limit = 10

[models]
default = "google/gemini-3-flash-preview"

[mas]
levels = 1
intra_level_link_ratio = 1.0
full_linked = true
number_of_agents = 1
agent_types = ["general"]
communication_count_internally = 0
turn_mode = "single_turn"
max_turns = 1

[finance_agent]
eval_mode = "substring"
max_tool_iterations = 8
web_search_top_n = 10
