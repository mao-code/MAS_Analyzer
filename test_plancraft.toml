[openrouter]
api_key = "" # Will be overridden by .env OPENROUTER_API_KEY
base_url = "https://openrouter.ai/api/v1"

[experiment]
output_dir = "outputs"
runs_per_task = 1
task_limit = 5
seed = 42

[mas]
levels = 1
intra_level_link_ratio = 1.0
full_linked = true
number_of_agents = 1
agent_types = ["general"]
communication_count_internally = 0
turn_mode = "single_turn"  # Use single_turn so it acts once per step, but the environment loop continues
max_turns = 1

[models]
default = "google/gemini-3-flash-preview"

[plancraft]
split = "val"
max_steps = 30
resolution = "low"
