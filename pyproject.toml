[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mas-analyzer"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "openai>=1.0",
    "python-dotenv>=1.2.1",
    "datasets>=4.5.0",
    "huggingface-hub>=1.4.1",
    "plancraft>=0.4.9",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["MAS*", "benchmark*", "descriptor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
