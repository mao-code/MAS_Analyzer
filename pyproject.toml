[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mas-analyzer"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "openai>=1.0",
    "python-dotenv>=1.2.1",
    "datasets>=4.5.0",
    "huggingface-hub>=1.4.1",
    "langchain>=0.3",
    "langgraph>=0.2",
    "plancraft>=0.4.9",
    "requests>=2.32.5",
    "loguru>=0.7.3",
    "scicode",
    "beautifulsoup4>=4.14.3",
    "aiohttp>=3.12.0",
    "backoff>=2.2.1",
]

[project.optional-dependencies]
claude = ["claude-agent-sdk>=0.1"]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["MAS*", "benchmark*", "descriptor*", "reproduce*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pre-commit>=4.2.0",
    "ruff>=0.11.6",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module level import not at top (scripts use sys.path hacks)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip() without strict= (not needed for our use cases)
    "SIM108", # use ternary operator (readability preference)
    "SIM115", # use context manager for opening files (test helpers)
    "SIM118", # use key in dict instead of key in dict.keys()
]

[tool.ruff.lint.isort]
known-first-party = ["MAS", "benchmark", "descriptor"]

[tool.uv.sources]
scicode = { git = "https://github.com/scicode-bench/SciCode" }
